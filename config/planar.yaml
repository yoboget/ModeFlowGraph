
data:
  max_num_nodes: 64

training:
  batch_size: 128
  learning_rate: 0.0001
  epochs: 100_000
  val_size: 40

model:
  architecture: 'gps'
  nhf: 256
  edge_node_ratio: 4
  n_layers: 8
  mlp_n_layers: 3
  normalization: layer_norm
  T: 128
  prior: marginal # 'marginal' or 'masking'

extra_features:
  spectral_embeddings: True
  k: 5
  graph_size: True
  molecular_feat: False
  cycles: True
  rrwp: False
  rrwp_k: 0

sampling:
  id: 'dfm'

log:
  n_loggin_steps: 1000
  n_loggin_epochs: 1000
  n_val_samples: 40
  sampling_batch_size: 40
  n_samples_generation: 40
